<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapLedger - Photobooth Accounting System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800">
<div class="flex min-h-screen">
  <aside id="sidebar" class="no-print w-60 shrink-0 p-4 text-violet-100 flex flex-col gap-1">
    <div class="px-2 pb-5"><div class="text-xl font-extrabold text-white">SnapLedger</div><div class="text-xs text-violet-300">Photobooth Accounting System</div></div>
    <nav id="nav" class="flex flex-col gap-1 text-sm"></nav>
    <button id="btnReset" class="mt-auto text-xs text-violet-300 hover:text-white text-left px-3 py-2">Reset data demo</button>
  </aside>
  <main class="flex-1 p-5 md:p-8 min-w-0">
    <header class="no-print flex flex-wrap items-center justify-between gap-3 mb-6">
      <div><h1 id="title" class="text-2xl font-extrabold"></h1><p id="period" class="text-sm text-slate-500"></p></div>
      <div class="flex gap-2"><button data-go="pos" class="btn">+ Transaksi Foto</button><button data-go="expense" class="btn btn-alt">Catat Pengeluaran</button></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><div class="glass bg-white rounded-2xl p-6 w-full max-w-sm" id="modalBody"></div></div>
<div id="toast" class="fixed bottom-5 right-5 z-50"></div>
<script src="app.js"></script>
</body>
</html>
